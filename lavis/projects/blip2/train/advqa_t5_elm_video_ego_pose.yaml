model:
  arch: blip2_vqa_t5_elm_video_ego_pose
  model_type: pretrain_flant5xl
  use_grad_checkpoint: False
  freeze_vit: False
  num_query_token: 32
  vit_precision: "fp32"
  max_txt_len: 320

  image_size: 364
  pretrained: pretrained-models/blip2_pretrained_flant5xl.pth

  first_stage_config:
    target: lavis.models.taming_transformers.taming.models.vqgan.VQModel
    params:
      # ckpt_path: logs/2024-01-10T04-08-42_custom_vqgan/checkpoints/last.ckpt
      # ckpt_path: logs/2024-07-25T12-54-19_custom_vqgan/checkpoints/last.ckpt
      ckpt_path: /home/yzhu/taming-transformers/logs/vqgan_imagenet_f16_1024/checkpoints/last.ckpt

      embed_dim: 256
      n_embed: 1024
      ddconfig:
        double_z: false
        z_channels: 256
        resolution: 256
        in_channels: 3
        out_ch: 3
        ch: 128
        ch_mult:
        - 1
        - 1
        - 2
        - 2
        - 4
        num_res_blocks: 2
        attn_resolutions:
        - 16
        dropout: 0.0


datasets:
  elmvideo: # name of the dataset builder coco_vqa
    vis_processor:
        train:
          name: "blip2_image_train"
          image_size: 364
        eval:
          name: "blip_image_eval"
          image_size: 364
    text_processor:
        train:
          name: "blip_question"
          prompt: ""
        eval:
          name: "blip_question"
    build_info:
        images:
            storage: 'data/nuscenes'
        annotations:
          train:
            storage: 'data/drivelm/train.json'
            url: None
          test:
            storage: 'data/drivelm/val.json'
            url: None
          val:
            storage: 'data/drivelm/val.json'
            url: None

run:
  task: 3d_vqa
  # optimizer
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-5
  min_lr: 1e-5
  warmup_lr: 1e-8
  warmup_steps: 750
  weight_decay: 0.05
  # max_epoch: 100
  max_epoch: 50
  # batch_size_train: 6
  batch_size_train: 2
  batch_size_eval: 4
  num_workers: 4 # 4
  # accum_grad_iters: 1
  accum_grad_iters: 2
  # resume_ckpt_path: null
  # resume_ckpt_path: "lavis/output/BLIP2/combine/20240810171/checkpoint_19.pth"
  # resume_ckpt_path: "lavis/output/BLIP2/combine/20240811164/checkpoint_30.pth"
  # rec_img
  # resume_ckpt_path: "lavis/output/BLIP2/combine/20240813194/checkpoint_20.pth"
  # pred_video
  # resume_ckpt_path: "lavis/output/BLIP2/combine/20240816173/checkpoint_25.pth" 
  # pred_video_ego_pose wo autoregressive
  # resume_ckpt_path: "lavis/output/BLIP2/combine/20240818185/checkpoint_15.pth"
  # pred_video_ego_pose w autoregressive
  resume_ckpt_path: "lavis/output/BLIP2/combine/20240820190/checkpoint_30.pth"

  max_len: 30 # 10
  min_len: 1
  num_beams: 5
 
  inference_method: "generate"

  seed: 42
  output_dir: "output/BLIP2/combine"

  amp: True
  # resume_ckpt_path: lavis/output/{checkpoint}

  # evaluate: False
  evaluate: True
  train_splits: ["train"]
  valid_splits: ["val"]
  test_splits: ["test"]

  device: "cuda"
  # world_size: 64
  world_size: 4
  # dist_url: "env://"
  dist_url: "env://127.0.0.1:23456"
  distributed: True
